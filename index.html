<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lista</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="ambient" aria-hidden="true"></div>

  <header class="topbar">
    <a class="brand" href="#lista" data-nav="lista">Lista</a>
    <nav class="nav" aria-label="Principal">
      <button type="button" class="nav-link is-active" data-nav="lista">Filmes</button>
      <button type="button" class="nav-link" data-nav="rapida">Rápida</button>
      <button type="button" class="nav-link" data-nav="adicionar">Adicionar</button>
    </nav>
  </header>

  <main>
    <section id="view-lista" class="view is-active" aria-labelledby="lista-title">
      <header class="view-header">
        <h1 id="lista-title">Filmes</h1>
        <p class="lede">Detalhes, links e quem recomendou.</p>
      </header>

      <div id="movie-list" class="movie-list" role="list"></div>
      <p id="empty-state" class="empty-state" hidden>Nenhum filme ainda. Adicione o primeiro.</p>
    </section>

    <section id="view-rapida" class="view" aria-labelledby="rapida-title" hidden>
      <header class="view-header">
        <h1 id="rapida-title">Rápida</h1>
        <p class="lede">Só os nomes — editável em <code>lista-rapida.md</code>.</p>
      </header>

      <div id="quick-lists" class="quick-lists"></div>
      <p id="quick-empty" class="empty-state" hidden>Não foi possível ler a lista rápida.</p>
    </section>

    <section id="view-adicionar" class="view" aria-labelledby="add-title" hidden>
      <header class="view-header">
        <h1 id="add-title">Adicionar</h1>
        <p class="lede">Nome, diretor e legendas aceitam links.</p>
      </header>

      <form id="movie-form" class="movie-form" novalidate>
        <div class="field-group">
          <label for="title">Filme</label>
          <input id="title" name="title" type="text" required autocomplete="off" placeholder="Título">
          <input id="titleUrl" name="titleUrl" type="url" autocomplete="off" placeholder="Link do filme (opcional)">
        </div>

        <div class="field-row">
          <div class="field-group">
            <label for="year">Ano</label>
            <input id="year" name="year" type="number" min="1888" max="2100" required placeholder="2024">
          </div>
          <div class="field-group">
            <label for="recommendedBy">Quem recomendou</label>
            <input id="recommendedBy" name="recommendedBy" type="text" required autocomplete="off" placeholder="Nome">
          </div>
        </div>

        <div class="field-group">
          <label for="director">Diretor</label>
          <input id="director" name="director" type="text" required autocomplete="off" placeholder="Nome do diretor">
          <input id="directorUrl" name="directorUrl" type="url" autocomplete="off" placeholder="Link do diretor (opcional)">
        </div>

        <div class="field-group">
          <label for="subtitles">Legendas</label>
          <input id="subtitles" name="subtitles" type="text" required autocomplete="off" placeholder="Fonte das legendas">
          <input id="subtitlesUrl" name="subtitlesUrl" type="url" autocomplete="off" placeholder="Link das legendas (opcional)">
        </div>

        <label class="check-field">
          <input id="watched" name="watched" type="checkbox">
          <span>Já visto</span>
        </label>

        <div class="form-actions">
          <button type="submit" class="btn btn-primary">Salvar filme</button>
          <p id="form-status" class="form-status" role="status" aria-live="polite"></p>
        </div>
      </form>
    </section>
  </main>

  <script src="js/app.js" type="module"></script>
</body>
</html>
